<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цифровой след — экспертиза страницы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Golos+Text:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0c1120; --line:rgba(120,150,220,.14);
  --paper:#f2e9d4; --paper2:#e6dabd;
  --blue:#4d7cfe; --amber:#ffc93f; --orange:#ff9a3d; --red:#ef5248; --green:#7fbf7a; --purple:#9b6dff;
  --text:#e9edf8; --mut:#8ea0c2;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--ink)}
body{font-family:'Golos Text',system-ui,sans-serif;color:var(--text);min-height:100vh;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-3;
  background:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px),var(--ink);
  background-size:44px 44px;mask-image:radial-gradient(120% 90% at 50% 0%,#000 40%,transparent 100%)}
.glow{position:fixed;z-index:-1;width:60vmax;height:60vmax;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(77,124,254,.16),transparent 60%);top:-20vmax;left:-15vmax;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(30vmax,20vmax) scale(1.15)}}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 60px}

header{animation:fadeUp .6s both;margin-bottom:18px}
.case{font-weight:800;font-size:11px;letter-spacing:.15em;color:var(--mut);text-transform:uppercase;margin-bottom:8px}
.case b{color:var(--amber)}
.rec{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:middle;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
h1{font-family:'Unbounded';font-weight:900;font-size:clamp(24px,7vw,34px);line-height:1.05}
h1 small{display:block;font-family:'Golos Text';font-weight:500;font-size:12.5px;color:var(--mut);margin-top:6px}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}}

/* Сканер */
#scan{animation:fadeUp .6s .1s both;text-align:center}
.subject{display:inline-flex;align-items:center;gap:9px;font-size:13px;color:var(--mut);margin-bottom:16px}
.subject img{width:32px;height:32px;border-radius:50%;border:2px solid var(--blue);background:#1a2440}
.subject b{color:var(--text)}
.frame{position:relative;width:180px;height:180px;margin:0 auto 18px;color:#6f92e8}
.frame svg{width:100%;height:100%;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.corner{position:absolute;width:22px;height:22px;border:3px solid var(--blue)}
.c1{top:0;left:0;border-right:0;border-bottom:0}.c2{top:0;right:0;border-left:0;border-bottom:0}
.c3{bottom:0;left:0;border-right:0;border-top:0}.c4{bottom:0;right:0;border-left:0;border-top:0}
.scanline{position:absolute;left:8%;right:8%;top:10%;height:3px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--blue),transparent);
  box-shadow:0 0 16px 3px rgba(77,124,254,.7);animation:scan 1.7s linear infinite alternate}
@keyframes scan{to{top:88%}}
.status{font-family:'Unbounded';font-weight:700;font-size:14px;min-height:22px}
.status::after{content:'▍';color:var(--blue);animation:blink 1s steps(2) infinite}
.pbar{height:6px;border-radius:3px;background:#1b2540;max-width:320px;margin:14px auto 0;overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--amber));transition:width .4s ease}

/* Досье */
#result{display:none}
#result.show{display:block;animation:fadeUp .5s both}
.dossier{position:relative;background:linear-gradient(160deg,var(--paper),var(--paper2));color:#20222b;
  border-radius:8px;padding:20px 18px;transform:rotate(-.5deg);box-shadow:0 22px 50px rgba(0,0,0,.5)}
.dossier::before{content:'';position:absolute;inset:0;border-radius:8px;pointer-events:none;opacity:.4;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(120,90,40,.05) 3px 4px)}
.d-top{display:flex;justify-content:space-between;font-size:10.5px;font-weight:800;letter-spacing:.15em;color:#8a7a54;text-transform:uppercase;border-bottom:2px dashed #b8a578;padding-bottom:9px;margin-bottom:14px}
.d-lbl{font-size:10.5px;font-weight:800;letter-spacing:.22em;color:#8a7a54;text-transform:uppercase;margin-bottom:3px}
.d-total{font-family:'Unbounded';font-weight:900;font-size:clamp(40px,12vw,56px);line-height:1;color:#171a24}
.d-name{font-family:'Unbounded';font-weight:700;font-size:clamp(17px,5vw,22px);margin:12px 0 3px;color:#1d2333}
.d-stars{font-size:18px;letter-spacing:3px;margin-bottom:12px}
.d-stars .on{color:#d8a013;display:inline-block;animation:popStar .45s cubic-bezier(.2,2,.4,1) both}
.d-stars .off{color:#c9bd9d}
@keyframes popStar{from{transform:scale(0) rotate(-60deg);opacity:0}}
.d-phrase{font-size:14.5px;font-weight:600;line-height:1.4;border-left:4px solid var(--red);padding-left:11px;margin-bottom:18px}

/* Карточки улик */
.evidence{display:grid;gap:10px;margin-bottom:18px}
.ev-card{background:rgba(30,35,60,.05);border:1px solid rgba(30,35,60,.08);border-radius:8px;padding:12px;opacity:0;animation:fadeUp .4s both}
.ev-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ev-title{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:#3a3226}
.ev-title .ic{font-size:16px}
.ev-val{font-family:'Unbounded';font-weight:700;font-size:13px;color:#1d2333}
.ev-bar{height:7px;border-radius:4px;background:rgba(30,35,60,.12);overflow:hidden;margin-bottom:8px}
.ev-bar i{display:block;height:100%;width:0;border-radius:4px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.ev-comment{font-size:12px;font-style:italic;color:#5a5040;line-height:1.35;border-left:2px solid currentColor;padding-left:8px}

.stamp{position:absolute;top:12px;right:12px;font-family:'Unbounded';font-weight:900;font-size:15px;letter-spacing:.07em;
  color:var(--red);border:3px solid var(--red);border-radius:6px;padding:5px 10px;transform:rotate(-12deg) scale(0);opacity:0}
.stamp.hit{animation:stampIn .45s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stampIn{0%{transform:rotate(-30deg) scale(2.6);opacity:0}100%{transform:rotate(-12deg) scale(1);opacity:.92}}
.barcode{height:30px;margin-top:4px;background:repeating-linear-gradient(90deg,#1c1c1c 0 2px,transparent 2px 4px,#1c1c1c 4px 7px,transparent 7px 9px,#1c1c1c 9px 10px,transparent 10px 15px)}

.btns{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:0;border-radius:12px;padding:14px;font-family:'Golos Text';font-weight:800;font-size:14px;cursor:pointer;transition:transform .15s,filter .15s}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--blue);color:#fff;box-shadow:0 8px 24px rgba(77,124,254,.35)}
.btn.pri:hover{filter:brightness(1.12)}
.btn.gho{background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.14)}
.btn.gho:hover{background:rgba(255,255,255,.1)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#1c2842;border:1px solid rgba(255,255,255,.15);
  font-size:13px;font-weight:600;padding:11px 18px;border-radius:99px;transition:transform .35s cubic-bezier(.2,1.4,.4,1);z-index:9;max-width:88vw;text-align:center}
.toast.on{transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap">

<header>
  <div class="case"><span class="rec"></span>ДЕЛО №<b id="caseNo">…</b> · ЭКСПЕРТИЗА СТРАНИЦЫ</div>
  <h1>Цифровой след
    <small>парсинг профиля. ни один лайк не останется безнаказанным.</small>
  </h1>
</header>

<section id="scan">
  <div class="subject">
    <img id="ava" alt="" onerror="this.style.display='none'">
    ОБЪЕКТ: <b id="uname">устанавливается…</b>
  </div>
  <div class="frame">
    <span class="corner c1"></span><span class="corner c2"></span>
    <span class="corner c3"></span><span class="corner c4"></span>
    <div class="scanline"></div>
    <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round">
      <circle cx="60" cy="60" r="9"  stroke-dasharray="38 10"  transform="rotate(20 60 60)"/>
      <circle cx="60" cy="60" r="17" stroke-dasharray="70 16"  transform="rotate(130 60 60)"/>
      <circle cx="60" cy="60" r="25" stroke-dasharray="105 22" transform="rotate(-40 60 60)"/>
      <circle cx="60" cy="60" r="33" stroke-dasharray="140 30" transform="rotate(75 60 60)"/>
      <circle cx="60" cy="60" r="41" stroke-dasharray="170 42" transform="rotate(-110 60 60)"/>
      <circle cx="60" cy="60" r="49" stroke-dasharray="205 60" transform="rotate(35 60 60)"/>
      <circle cx="60" cy="60" r="56" stroke-dasharray="230 80" transform="rotate(-160 60 60)"/>
    </svg>
  </div>
  <div class="status" id="status">Подключение к архиву…</div>
  <div class="pbar"><i id="pfill"></i></div>
</section>

<section id="result">
  <div class="dossier">
    <div class="stamp" id="stamp">РОЗЫСК</div>
    <div class="d-top"><span>МВД РАЗДЕЛА «ВКОНТАКТЕ»</span><span id="dCase">дело №…</span></div>
    <div class="d-lbl">Общий индекс следов</div>
    <div class="d-total" id="total">0</div>
    <div class="d-name" id="lname">—</div>
    <div class="d-stars" id="stars"></div>
    <div class="d-phrase" id="phrase">—</div>
    
    <div class="d-lbl" style="margin-bottom:8px">Детальная экспертиза</div>
    <div class="evidence" id="evidence"></div>
    
    <div class="d-lbl" style="margin-bottom:6px">Идентификатор улики</div>
    <div class="barcode"></div>
  </div>
  <div class="btns">
    <button class="btn pri" id="share">🚔 Поделиться делом</button>
    <button class="btn gho" id="rescan">Повторный допрос</button>
  </div>
</section>

</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/@vkontakte/vk-bridge@2/dist/browser.min.js"></script>
<script>
/* ═══ ОБЩИЕ УРОВНИ РОЗЫСКА ═══ */
const LEVELS=[
 {min:0,    max:99,    stars:1, name:'Призрак',             stamp:'ЧИСТ',         phrase:'Ты лишь тронул ВК и исчез. Даже алгоритм сделал вид, что не заметил.'},
 {min:100,  max:499,   stars:2, name:'Сочувствующий',       stamp:'НА УЧЁТЕ',     phrase:'Сотни следов. Центр «Э» внёс тебя в общую таблицу. Пока карандашом.'},
 {min:500,  max:1499,  stars:2, name:'Локальный мемолог',   stamp:'ОПОЗНАН',      phrase:'Тебя цитируют в комментариях. Дважды. Один раз — мама.'},
 {min:1500, max:3999,  stars:3, name:'Штатный комментатор', stamp:'ПРИВЛЕЧЁН',    phrase:'Твоё мнение учтено. Как минимум в двух чатах и под новостью про ЖКХ.'},
 {min:4000, max:7999,  stars:3, name:'Активный гражданин',  stamp:'ПОД КОЛПАКОМ', phrase:'Следов хватит на тонкое дело. У дела уже есть папка и пятно от кофе.'},
 {min:8000, max:14999, stars:4, name:'Подозреваемый',       stamp:'ПОДОЗРЕВАЕМЫЙ',phrase:'Ты оставил {n} следов в ВК. Полиция начала проверку алиби.'},
 {min:15000,max:19999, stars:4, name:'Фигурант',            stamp:'РОЗЫСК',       phrase:'Ты оставил {n} следов в ВК. Полиция уже едет.'},
 {min:20000,max:29999, stars:4, name:'Особо разыскиваемый', stamp:'В РОЗЫСКЕ',    phrase:'Твой профиль висит на дверях «Вкусно — и точка». Как ориентировка.'},
 {min:30000,max:39999, stars:5, name:'Особо опасен',        stamp:'ОПАСЕН',       phrase:'Твои посты проверяют три отдела. Два из них выдумали на месте.'},
 {min:40000,max:1e9,   stars:5, name:'Цифровой бессмертный',stamp:'БЕССМЕРТЕН',   phrase:'Аккаунт можно удалить, расследование — нет. Архив вечен.'}
];

/* ═══ ПРАВИЛА ДЛЯ КАЖДОЙ МЕТРИКИ (Сарказм по диапазонам) ═══ */
const METRICS=[
  {
    key:'likes', icon:'❤️', name:'Лайки', color:'var(--red)',
    rules:[
      {max:50,   text:'Твой путь чист, но сердце ты положишь ещё многим.'},
      {max:500,  text:'Избирательная щедрость. Ты ставишь лайки только тем, от кого что-то хочешь.'},
      {max:5000, text:'Палец стёрт до кости. Ты лайкаешь всё, что движется, и даже то, что не движется.'},
      {max:1e9,  text:'Алгоритм считает тебя своим. Ты поставил больше лайков, чем у некоторых людей клеток мозга.'}
    ]
  },
  {
    key:'friends', icon:'👥', name:'Друзья', color:'var(--green)',
    rules:[
      {max:20,   text:'Круг общения: ты, твой кот и три бота из 2012 года.'},
      {max:150,  text:'Нормальный уровень социальной изоляции. Друзья есть, но они не знают, где ты живёшь.'},
      {max:500,  text:'Душа компании. Или ты просто не умеешь удалять бывших.'},
      {max:1e9,  text:'У тебя больше друзей, чем у депутата перед выборами. Половина из них — мёртвые души.'}
    ]
  },
  {
    key:'followers', icon:'📣', name:'Подписчики', color:'var(--amber)',
    rules:[
      {max:50,   text:'Тебя читают только те, кому ты должен денег.'},
      {max:300,  text:'Скромная аудитория. В основном это бывшие, проверяющие, не счастлив ли ты.'},
      {max:2000, text:'Микроинфлюенсер. Ты думаешь о монетизации, но пока монетизируешь только своё терпение.'},
      {max:1e9,  text:'Почти блогер. Твои подписчики ждут контента, а ты ждёшь, когда это всё закончится.'}
    ]
  },
  {
    key:'tracks', icon:'🎵', name:'Музыка', color:'var(--purple)',
    rules:[
      {max:50,   text:'Твой плейлист помещается на одну кассету. Ты либо аскет, либо у тебя нет вкуса.'},
      {max:300,  text:'Эклектика. Утром шансон, вечером инди-рок. Психиатр уже в курсе?'},
      {max:1000, text:'Коллекционер. Ты сохраняешь треки, которые никогда не включишь второй раз.'},
      {max:1e9,  text:'Твоя медиатека весит больше, чем твоя совесть. Алгоритм рекомендует "Звуки природы для сна".'}
    ]
  },
  {
    key:'posts', icon:'📝', name:'Посты', color:'var(--blue)',
    rules:[
      {max:10,   text:'Молчание — золото. Или ты просто боишься написать то, что используют против тебя.'},
      {max:100,  text:'Периодические вспышки активности. Обычно после расставания или энергетиков.'},
      {max:500,  text:'Летописец. Ты документируешь каждый чих, как будто это имеет историческую ценность.'},
      {max:1e9,  text:'Спам-машина. Твоя стена выглядит как доска объявлений в подъезде.'}
    ]
  },
  {
    key:'comments', icon:'💬', name:'Комментарии', color:'var(--orange)',
    rules:[
      {max:20,   text:'Наблюдатель. Ты читаешь, киваешь и идёшь дальше. Мудро.'},
      {max:200,  text:'Спорщик. Ты вступаешь в перепалки с незнакомцами в 3 часа ночи.'},
      {max:1000, text:'Местный философ. Твои комментарии длиннее, чем некоторые статьи в Википедии.'},
      {max:1e9,  text:'Тролль 80-го уровня. Модераторы знают тебя в лицо и ненавидят всей душой.'}
    ]
  }
];

const BACKEND_URL=''; // Впиши сюда свой API, если есть
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('ru-RU');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const getLevel=t=>LEVELS.find(l=>t>=l.min&&t<=l.max);

let user={id:Math.floor(Math.random()*9e5)+1e4,first_name:'Аноним'},total=0,lvl=null,scans=0;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function simulate(id){
  const r=mulberry32((id*2654435761)>>>0);
  const ri=(a,b)=>Math.round(a+r()*(b-a));
  return{likes:ri(10,35000),friends:ri(5,900),followers:ri(0,3500),tracks:ri(5,2500),posts:ri(0,600),comments:ri(5,4000)};
}

async function fetchCounts(){
  let d;
  if(BACKEND_URL){try{
    const res=await fetch(`${BACKEND_URL}?user_id=${user.id}`);
    const j=await res.json();
    if(j&&Number.isFinite(j.likes+j.posts))d={...simulate(user.id),...j};
  }catch(e){}}
  if(!d)d=simulate(user.id);
  // Единственное честное число из бриджа
  try{const f=await vkBridge.send('VKWebAppGetFriends');if(f&&f.items){d.friends=f.items.length;d.friendsReal=true;}}catch(e){}
  return d;
}

function getComment(metricKey, value){
  const m=METRICS.find(x=>x.key===metricKey);
  return m.rules.find(r=>value<=r.max).text;
}

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2600)}
function taptic(){try{vkBridge.send('VKWebAppTapticImpactOccurred',{style:'heavy'})}catch(e){}}

async function startScan(){
  $('result').classList.remove('show');$('result').style.display='none';
  $('scan').style.display='block';$('pfill').style.width='0%';
  const countsP=fetchCounts();
  const stages=[
    ['Сканирование аватара и имени…',10],
    ['Парсинг стены и постов…',28],
    ['Подсчёт лайков и репостов…',48],
    ['Анализ списка друзей…',65],
    ['Инвентаризация аудиозаписей…',82],
    ['Формирование итогового досье…',95]
  ];
  for(const[msg,p]of stages){
    $('status').textContent=msg;
    $('pfill').style.width=p+'%';
    await sleep(450+Math.random()*300);
  }
  const c=await countsP;
  $('pfill').style.width='100%';await sleep(400);
  reveal(c);
}

function reveal(c){
  total=METRICS.reduce((s,m)=>s+(+c[m.key]||0),0);
  lvl=getLevel(total);scans++;
  $('scan').style.display='none';$('result').style.display='block';$('result').classList.add('show');
  $('lname').textContent=lvl.name;
  $('phrase').textContent=lvl.phrase.replace('{n}',fmt(total));
  $('stamp').textContent=lvl.stamp;$('stamp').classList.remove('hit');
  
  let s='';for(let i=0;i<5;i++)s+=`<span class="${i<lvl.stars?'on':'off'}" style="animation-delay:${.4+i*.12}s">★</span>`;
  $('stars').innerHTML=s;
  
  // Генерация карточек улик с персональными комментариями
  const mx=Math.max(...METRICS.map(m=>+c[m.key]||0),1);
  $('evidence').innerHTML=METRICS.map((m,i)=>{
    const val=+c[m.key]||0;
    const comment=getComment(m.key,val);
    const w=Math.max(4,(val/mx)*100);
    const realBadge=m.key==='friends'&&c.friendsReal?'<span style="font-size:9px;color:#4a7d46;font-weight:800;margin-left:4px">[ТОЧНО]</span>':'';
    return `
    <div class="ev-card" style="animation-delay:${.2+i*.08}s">
      <div class="ev-head">
        <div class="ev-title"><span class="ic">${m.icon}</span>${m.name}${realBadge}</div>
        <div class="ev-val">${fmt(val)}</div>
      </div>
      <div class="ev-bar"><i data-w="${w}" style="background:${m.color};transition-delay:${.4+i*.08}s"></i></div>
      <div class="ev-comment" style="color:${m.color}">${comment}</div>
    </div>`;
  }).join('');
  
  setTimeout(()=>$('evidence').querySelectorAll('.ev-bar i').forEach(i=>i.style.width=i.dataset.w+'%'),80);
  
  const t0=performance.now(),dur=1600;
  (function tick(now){const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(2,-10*k);
    $('total').textContent=fmt(total*e);if(k<1)requestAnimationFrame(tick)})(t0);
    
  setTimeout(()=>{$('stamp').classList.add('hit');taptic()},1000);
}

$('share').onclick=async()=>{
  const txt=`Моё цифровое досье: ${fmt(total)} следов. Статус: «${lvl.name}» ${'★'.repeat(lvl.stars)}. ${lvl.phrase.replace('{n}',fmt(total))} 🚔`;
  try{await vkBridge.send('VKWebAppShare',{type:'post',message:txt});return}catch(e){}
  try{await navigator.clipboard.writeText(txt);toast('Скопировано. Вставляй в личку, пока не забрали.')}
  catch(e){toast('Скопировать не вышло. Расскажешь на допросе.')}
};
$('rescan').onclick=async()=>{await startScan();if(scans>1)toast('Повторный допрос: показания совпадают. Архив не врёт.')};

async function init(){
  try{
    await vkBridge.send('VKWebAppInit');
    const u=await vkBridge.send('VKWebAppGetUserInfo');
    if(u&&u.id){user=u;if(u.photo_100)$('ava').src=u.photo_100;}
  }catch(e){}
  $('caseNo').textContent=user.id;$('dCase').textContent='дело №'+user.id;
  $('uname').textContent=user.first_name||'Аноним';
  await sleep(350);startScan();
}
init();
</script>
</body>
</html>
