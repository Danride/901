<script>
  let footprint = null;

  async function loadFootprint() {
    try {
      // 1. Инициализация
      await vkBridge.send('VKWebAppInit');
      
      // 2. Получаем user info (быстро, без API)
      const userInfo = await vkBridge.send('VKWebAppGetUserInfo');
      
      // 3. ОДИН запрос к API — получаем counters
      const userRes = await vkBridge.send('VKWebAppCallAPIMethod', {
        method: 'users.get',
        params: {
          user_ids: userInfo.id,
          fields: 'counters',
          v: '5.131'
        }
      });

      const user = userRes.response[0];
      const c = user.counters || {};

      // 4. Собираем данные (без wall.get — он медленный)
      footprint = {
        name: `${user.first_name} ${user.last_name}`,
        photos: c.photos || 0,
        albums: c.albums || 0,
        videos: c.videos || 0,
        audios: c.audios || 0,
        notes: c.notes || 0,
        friends: c.friends || 0,
        groups: c.groups || 0,
        followers: c.followers || 0,
        posts: 0, // Убираем посты — они требуют отдельный запрос
        pages: c.pages || 0,
      };

      footprint.total = Object.entries(footprint)
        .filter(([k]) => k !== 'name')
        .reduce((sum, [, v]) => sum + v, 0);

      render();

    } catch (e) {
      console.error('Ошибка:', e);
      const loadingEl = document.getElementById('loading');
      
      if (e.message === 'NOT_VK_ENV' || (e.error_data && e.error_data.error_code === 1)) {
        loadingEl.className = 'error-box';
        loadingEl.innerHTML = `
          <div style="font-size: 48px; margin-bottom: 16px;">🚫</div>
          <strong>Открой через vk.com/appТВОЙ_ID</strong><br><br>
          Прямая ссылка не работает.
        `;
      } else {
        loadingEl.className = 'error-box';
        loadingEl.innerHTML = `
          <div style="font-size: 48px; margin-bottom: 16px;">⚠️</div>
          <strong>Ошибка</strong><br>
          ${e.error_data?.error_msg || e.message}<br>
          <small>Код: ${e.error_data?.error_code || 'N/A'}</small>
        `;
      }
    }
  }

  function getVerdicts(fp) {
    const total = fp.total;
    let totalVerdict;
    if (total < 100) totalVerdict = '👻 Цифровой призрак. Ты вообще заходишь в ВК?';
    else if (total < 500) totalVerdict = '🤫 Тихий наблюдатель. Лайкаешь из тени.';
    else if (total < 2000) totalVerdict = '🙂 Обычный пользователь. След нормальный.';
    else if (total < 5000) totalVerdict = '📢 Активный гражданин. След виден из космоса.';
    else if (total < 10000) totalVerdict = '🔥 Цифровой маньяк. Следов больше, чем у преступника.';
    else totalVerdict = '☢️ Угроза приватности. ФСБ знает о тебе всё.';

    const cats = [];
    if (fp.photos > 500) cats.push(`📸 ${fp.photos} фото — ты либо фотограф, либо нарцисс.`);
    else if (fp.photos > 100) cats.push(`📸 ${fp.photos} фото — умеренный селфи-зависимый.`);
    else cats.push(`📸 ${fp.photos} фото — скромняга или нечего показать.`);

    if (fp.audios > 500) cats.push(`🎵 ${fp.audios} треков — плейлист тяжелее диплома.`);
    else if (fp.audios > 100) cats.push(`🎵 ${fp.audios} треков — меломан средней руки.`);
    else cats.push(`🎵 ${fp.audios} треков — музыка для тебя — тёмный лес.`);

    if (fp.friends > 500) cats.push(`👥 ${fp.friends} друзей — душа компании или добавляешь всех.`);
    else if (fp.friends > 100) cats.push(`👥 ${fp.friends} друзей — нормальный круг.`);
    else cats.push(`👥 ${fp.friends} друзей — интроверт уровня «бог».`);

    if (fp.groups > 100) cats.push(`🏢 ${fp.groups} групп — подписан на всё, фокус — ноль.`);
    else if (fp.groups > 30) cats.push(`🏢 ${fp.groups} групп — умеренный подписчик.`);
    else cats.push(`🏢 ${fp.groups} групп — минималист. Уважаю.`);

    return { totalVerdict, cats };
  }

  function render() {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('content').classList.remove('hidden');

    document.getElementById('total').textContent = footprint.total.toLocaleString('ru-RU');

    const v = getVerdicts(footprint);
    document.getElementById('totalVerdict').textContent = v.totalVerdict;

    const categories = [
      { key: 'photos', label: '📸 Фотографии' },
      { key: 'audios', label: '🎵 Аудиозаписи' },
      { key: 'friends', label: '👥 Друзья' },
      { key: 'groups', label: '🏢 Группы' },
      { key: 'videos', label: '🎬 Видео' },
      { key: 'albums', label: '📁 Альбомы' },
      { key: 'notes', label: '📓 Заметки' },
      { key: 'followers', label: '👁 Подписчики' },
      { key: 'pages', label: '📄 Публичные страницы' },
    ];

    const maxVal = Math.max(...categories.map(c => footprint[c.key]), 1);
    const sorted = [...categories].sort((a, b) => footprint[b.key] - footprint[a.key]);
    const top3 = sorted.slice(0, 3);

    document.getElementById('topList').innerHTML = top3.map(c => `
      <div class="row">
        <div style="flex:1">
          <div class="row-label">${c.label}</div>
          <div class="progress">
            <div class="progress-bar" style="width:${(footprint[c.key]/maxVal)*100}%"></div>
          </div>
        </div>
        <div class="row-value" style="margin-left:12px">${footprint[c.key].toLocaleString('ru-RU')}</div>
      </div>
    `).join('');

    document.getElementById('fullList').innerHTML = categories.map(c => `
      <div class="row">
        <div style="flex:1">
          <div class="row-label">${c.label}</div>
          <div class="progress">
            <div class="progress-bar" style="width:${(footprint[c.key]/maxVal)*100}%"></div>
          </div>
        </div>
        <div class="row-value" style="margin-left:12px">${footprint[c.key].toLocaleString('ru-RU')}</div>
      </div>
    `).join('');

    document.getElementById('verdictsList').innerHTML = v.cats.map(t =>
      `<div class="verdict-card">${t}</div>`
    ).join('');
  }

  async function unlockWithAd() {
    try {
      await vkBridge.send('VKWebAppShowNativeAds', { ad_format: 'reward' });
      document.getElementById('lockedBlock').classList.add('hidden');
      document.getElementById('fullBlock').classList.remove('hidden');
    } catch (e) {
      document.getElementById('lockedBlock').classList.add('hidden');
      document.getElementById('fullBlock').classList.remove('hidden');
    }
  }

  async function shareResult() {
    if (!footprint) return;
    const text = `🔍 Мой цифровой след в ВК: ${footprint.total.toLocaleString('ru-RU')} действий!\n` +
      `📸 ${footprint.photos} фото | 🎵 ${footprint.audios} треков | 👥 ${footprint.friends} друзей\n` +
      `А какой след у тебя?`;

    try {
      await vkBridge.send('VKWebAppShowWallPostBox', { message: text });
    } catch (e) {
      console.error('Share error', e);
    }
  }

  loadFootprint();
</script>
